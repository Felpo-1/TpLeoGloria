server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.elasticsearch.uris=http://localhost:9200

spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=6379

spring.data.mongodb.uri=mongodb://${MONGO_HOST:localhost}:27017/guilda_logs

management.endpoints.web.exposure.include=health,info,env,metrics
management.endpoint.health.show-details=always


logging.level.org.springframework.security=INFO

app.security.admin.user=admin
app.security.admin.pass=admin123
app.security.user.user=user
app.security.user.pass=user123
