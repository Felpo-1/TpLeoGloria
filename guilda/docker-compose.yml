version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: guilda-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.13.0
    container_name: guilda-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  redis:
    image: redis:7-alpine
    container_name: guilda-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo:6-jammy
    container_name: guilda-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build: .
    container_name: guilda-api
    ports:
      - "8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/postgres
      - SPRING_ELASTICSEARCH_URIS=http://elasticsearch:9200
      - REDIS_HOST=redis
      - MONGO_HOST=mongodb
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_started
      redis:
        condition: service_started
      mongodb:
        condition: service_started

volumes:
  pgdata:
  esdata:
  mongodata:
